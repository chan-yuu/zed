name: Build Fork Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v0.234.0-i18n.1)"
        required: true
        type: string
      publish_release:
        description: "Publish a GitHub Release with built binaries"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: build-fork-release
  cancel-in-progress: true

jobs:
  bundle_linux_x86_64:
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: build-fork-release-v2

      - name: Setup sccache
        run: ./script/setup-sccache

      - name: Enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Build Linux release bundle
        run: ./script/bundle-linux

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/zed-linux-x86_64.tar.gz dist/zed-linux-x86_64.tar.gz
          cp target/zed-remote-server-linux-x86_64.gz dist/zed-remote-server-linux-x86_64.gz

      - name: Show Linux artifact sizes
        run: ls -lh dist/zed-linux-x86_64.tar.gz dist/zed-remote-server-linux-x86_64.gz

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-linux-bundle-x86_64
          path: |
            dist/zed-linux-x86_64.tar.gz
            dist/zed-remote-server-linux-x86_64.gz

  bundle_windows_x86_64:
    runs-on: windows-2022
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable long paths for git
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: build-fork-release-v2

      - name: Cache Windows bundle dependencies
        uses: actions/cache@v4
        with:
          path: |
            AGS_SDK_v6.3.0.zip
            AGS_SDK-6.3.0
            Microsoft.Windows.Console.ConPTY.1.23.251216003.nupkg
            conpty
          key: windows-bundle-deps-v1

      - name: Setup sccache
        shell: pwsh
        run: ./script/setup-sccache.ps1

      - name: Enable sccache
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows release bundle
        shell: pwsh
        env:
          CI: ""
        run: script/bundle-windows.ps1 -Architecture x86_64

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -Path dist -ItemType Directory -Force | Out-Null
          Copy-Item target/Zed-x86_64.exe dist/Zed-x86_64.exe -Force
          Copy-Item target/zed-remote-server-windows-x86_64.zip dist/zed-remote-server-windows-x86_64.zip -Force

      - name: Show Windows artifact sizes
        shell: pwsh
        run: |
          Get-Item dist/Zed-x86_64.exe, dist/zed-remote-server-windows-x86_64.zip | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: if ($env:RUSTC_WRAPPER) { & $env:RUSTC_WRAPPER --show-stats }; exit 0

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-windows-bundle-x86_64
          path: |
            dist/Zed-x86_64.exe
            dist/zed-remote-server-windows-x86_64.zip

  publish_release:
    runs-on: ubuntu-22.04
    needs:
      - bundle_linux_x86_64
      - bundle_windows_x86_64
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/zed-linux-bundle-x86_64/zed-linux-x86_64.tar.gz
            dist/zed-linux-bundle-x86_64/zed-remote-server-linux-x86_64.gz
            dist/zed-windows-bundle-x86_64/Zed-x86_64.exe
            dist/zed-windows-bundle-x86_64/zed-remote-server-windows-x86_64.zip
